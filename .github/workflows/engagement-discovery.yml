# Laptop-off Instagram engagement discovery.
# Runs daily in GitHub Actions: scrapes city-targeted posts via Apify,
# screens + generates comments (OpenAI), and syncs pending comments to the
# Supabase engagement_queue table. Posting stays manual (laptop-on, via
# Claude driving Chrome) - this workflow never posts anything to Instagram.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   APIFY_TOKEN                  Apify API token
#   OPENAI_API_KEY               OpenAI key for screening + comment generation
#   SUPABASE_URL                 https://tnqctocershbclhbjnwg.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    Supabase service-role key

name: Engagement Discovery

on:
  # DISABLED 2026-08-20 — manual trigger only.
  #
  # This ran daily for 31 runs and its output was never used. Posting happens
  # entirely through the local browser queue (comment-queue.json +
  # chrome-engagement-runner.py); this workflow writes to Supabase
  # engagement_queue, which nothing posts from. The result was 415 orphaned
  # pending rows, of which 131 were for posts we had ALREADY commented on —
  # a duplicate-comment hazard if anyone ran `cloud-queue.py next`.
  #
  # It also spent Apify + OpenAI credits on every run to produce those unused
  # comments. See DUAL-SYSTEM-FINDING-2026-08-20.md.
  #
  # workflow_dispatch is kept so it can still be run by hand if browser-based
  # discovery is ever unavailable. Before re-enabling the schedule, confirm
  # cloud-queue.py's dedup guard (_locally_handled_shortcodes) is still in place,
  # otherwise the two queues will drift again.
  #
  #  schedule:
  #    - cron: '0 12 * * *'   # daily 12:00 UTC = 5am PT / 8am ET
  workflow_dispatch: {}

concurrency:
  group: engagement-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discover city-targeted posts (Apify)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python agents/engagement-bot.py discover

      - name: Generate comments and sync to Supabase queue
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python agents/engagement-bot.py generate
